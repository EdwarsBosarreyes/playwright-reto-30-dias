name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Campo opcional para filtrar los tests de playwright"
        required: false
        type: string
      project:
        description: "Campo opcional para indicar el project"
        required: false
        type: string
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: dev
    env:
      ADMIN_USERNAME: ${{vars.ADMIN_USERNAME}}
      ADMIN_PASSWORD: ${{secrets.ADMIN_PASSWORD}}
      EMPLOYEE_USERNAME: ${{vars.EMPLOYEE_USERNAME}}
      EMPLOYEE_PASSWORD: ${{secrets.EMPLOYEE_PASSWORD}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: |
          if [ -n "${{github.event.inputs.grep}}" ] && [-n "${{github.event.inputs.project}}"]; then
            npx playwright test --grep "${{github.event.inputs.grep}}" --project="${{github.event.inputs.project}}" 
          else
            npx playwright test --project="admin"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
